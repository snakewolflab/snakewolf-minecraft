<h2>ダッシュボード</h2>
<div class="dashboard-grid">
    <div class="card status-card">
        <h3>接続中のプレイヤー数</h3>
        <p id="playerCount">0</p>
    </div>
    <div class="card status-card">
        <h3>サーバー稼働時間</h3>
        <p id="uptime">0h 0m 0s</p>
    </div>
    <div class="card status-card">
        <h3>サーバー状態</h3>
        <p id="serverStatus" class="status-indicator-text offline">オフライン</p>
    </div>
    <div class="card status-card">
        <h3>平均Ping</h3>
        <p id="averagePing">N/A ms</p>
    </div>
</div>
<div class="motd-card card">
    <h3>サーバーMOTD</h3>
    <p id="serverMotd">サーバーの説明文がここに表示されます。</p>
</div>
