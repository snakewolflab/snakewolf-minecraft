<div class="dashboard-card">
    <h3>サーバー状態</h3>
    <p>ステータス: <span id="serverStatusText" class="status-indicator offline">オフライン</span></p>
    <p>稼働時間: <span id="serverUptime">0秒</span></p>
</div>

<div class="dashboard-card">
    <h3>プレイヤー</h3>
    <p>オンライン: <span id="playerCount">0</span> / <span id="maxPlayers">0</span></p>
</div>

<div class="dashboard-card">
    <h3>メモリ使用量</h3>
    <p><span id="memoryUsed">0</span> MB / <span id="memoryTotal">0</span> MB (<span id="memoryMax">0</span> MB Max)</p>
</div>

<div class="dashboard-card">
    <h3>パフォーマンス</h3>
    <p>TPS: <span id="serverTPS">0.0</span></p>
    <p>CPU負荷: <span id="cpuLoad">0.0</span>%</p>
</div>

<style>
    .status-indicator {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        color: white;
    }
    .status-indicator.online { background-color: #4CAF50; } /* 緑 */
    .status-indicator.offline { background-color: #f44336; } /* 赤 */
    /* ... その他のダッシュボードカードのスタイル ... */
</style>
