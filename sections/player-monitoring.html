<h2>プレイヤー監視</h2>
<div class="monitoring-controls">
    <button id="refreshScreenshots" class="btn primary-btn">画面更新</button>
    <select id="playerSelectForMonitor" class="form-select">
        <option value="all">全プレイヤー</option>
        </select>
</div>
<div class="screenshot-grid" id="screenshotGrid">
    <div class="player-screen-card card">
        <p>プレイヤーA</p>
        <img src="https://via.placeholder.com/200x150?text=No+Image" alt="Player Screen" class="player-screenshot">
    </div>
    <div class="player-screen-card card">
        <p>プレイヤーB</p>
        <img src="https://via.placeholder.com/200x150?text=No+Image" alt="Player Screen" class="player-screenshot">
    </div>
</div>
<div class="map-view card" id="mapView">
    <h3>マップ表示</h3>
    <img src="https://via.placeholder.com/600x400?text=Minecraft+Map" alt="Minecraft Map" class="full-width-image">
    <p class="map-note">ここにプレイヤーの位置が表示されるインタラクティブなマップを実装予定</p>
</div>
